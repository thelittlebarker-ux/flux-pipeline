<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>drivEV Fleet Command</title>
<meta name="description" content="Fleet manager portal prototype for the Pos Malaysia drivEV POC: exception-only alerts, live vehicle map, charging sessions, costs and policy settings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail + sticky top bar; content is a 12-col grid of panels, collapsing to one column under 900px. */
:root{
  --navy:#17145a; --navy-2:#2a2680; --green:#17a874; --green-2:#0e8c5f; --mint:#dff5ec; --mint-2:#b9ead6;
  --bg:#ffffff; --panel:#ffffff; --panel-2:#f4f6fa; --ink:#15173a; --ink-2:#4f5478; --ink-3:#8a8fae; --line:#e0e4ee; --line-2:#cfd4e2;
  --good:#17a874; --warn:#e08a00; --bad:#d93d3d; --good-bg:#e4f7ef; --warn-bg:#fff4e0; --bad-bg:#fdeaea; --info-bg:#e8edff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --rail:#ffffff; --rail-ink:#4f5478; --rail-on:#17a874; --shadow-s:0 2px 12px rgba(23,20,90,.06);
  --shadow:0 10px 30px rgba(23,20,90,.10);
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:var(--display);letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
a{color:var(--green-2)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);border-right:1px solid var(--line);padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh}
.rail .brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy);padding:4px 10px 14px;letter-spacing:-.02em}
.rail .brand b{color:var(--rail-on)}
.rail .brand small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.rail .sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:600;font-size:13.5px;width:100%;text-align:left;color:var(--rail-ink)}
.nav:hover{background:var(--panel-2)}
.nav.on{background:var(--mint);color:var(--navy)}
.nav.on svg{color:var(--rail-on)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.rail .foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:10px;line-height:1.4}
.rail .foot a{color:var(--green-2)}
.rail .logo{height:32px;width:auto;margin:4px 10px 10px;display:block}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:800}
.top .fleet{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);font-weight:600;font-size:13px}
.top .fleet span.l{color:var(--ink-3);font-weight:500}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--mint);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:var(--shadow-s)}
.panel.flush{padding:0;overflow:hidden}
.panel h2{font-size:15px;font-weight:700}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel.flush .ph{padding:14px 16px 0}
.sub{color:var(--ink-2);font-size:13px;margin:2px 0 0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.c2{grid-column:span 2}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;box-shadow:var(--shadow-s)}
.tile .l{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin-top:6px;color:var(--ink)}
.tile .v small{font-size:14px;font-weight:600;color:var(--ink-3)}
.tile .d{font-size:12px;color:var(--ink-3);margin-top:4px}
.tile.alert{border-color:var(--bad);background:var(--bad-bg)}
.tile.alert .v{color:var(--bad)}
.tile.ok{border-color:var(--green)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--green-2)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--navy)}.pill.muted{background:var(--panel-2);color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--green);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--panel);border-color:var(--line-2);color:var(--ink)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--panel-2)}
.tbl{overflow-x:auto}
.plate{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--good)}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.soc{display:flex;align-items:center;gap:8px}
.soc b{width:36px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
.search{border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font:inherit;background:var(--panel);color:var(--ink);min-width:160px}
select.search{padding-right:26px}
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0;padding-top:0}
.ev .bar{width:4px;border-radius:2px;background:var(--bad);align-self:stretch}
.ev.warn .bar{background:var(--warn)}.ev.info .bar{background:var(--navy)}.ev.good .bar{background:var(--good)}
.ev .t{font-weight:700;font-family:var(--display);font-size:14px}
.ev .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ev .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ev .when{font-size:12px;color:var(--ink-3);white-space:nowrap}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--panel)}
.strip i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.map{position:relative;background:var(--panel-2);border-radius:12px;overflow:hidden;aspect-ratio:900/430;max-width:100%;border:1px solid var(--line)}
.map text{paint-order:stroke;stroke:var(--panel-2);stroke-width:3px;stroke-linejoin:round}
.map svg{width:100%;height:100%;display:block}
.map .veh{cursor:pointer}
.map .veh:hover circle:first-child{r:11}
.maplegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:10px 2px 0}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;animation:slide .2s ease;padding-top:env(safe-area-inset-top,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .db{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.35);z-index:35}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.kv .k{font-size:11.5px;color:var(--ink-3)}
.kv .v{font-family:var(--display);font-weight:800;font-size:18px;margin-top:2px}
.tl{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;align-items:start}
.tl:first-child{border-top:0}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);margin-top:5px;margin-left:3px}
.tl .dot.g{background:var(--good)}.tl .dot.b{background:var(--bad)}.tl .dot.n{background:var(--navy)}
.tl .when{color:var(--ink-3);font-size:12px;white-space:nowrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast svg{width:18px;height:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:600;font-size:13px}
.f .hint{font-size:12px;color:var(--ink-3)}
.f input[type=range]{accent-color:var(--green);width:100%}
.f .val{font-family:var(--display);font-weight:800;font-size:22px}
.f select,.f input[type=text],.f input[type=number],.f input[type=time]{border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font:inherit;background:var(--panel);color:var(--ink)}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;font-weight:500;cursor:pointer}
.radio label:has(input:checked){border-color:var(--green);background:var(--mint)}
.radio input{accent-color:var(--green)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px}
.sw input{accent-color:var(--green);width:18px;height:18px}
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.rule .sev{width:10px;height:10px;border-radius:50%}
.rule .n{font-weight:600}
.rule .d{font-size:12.5px;color:var(--ink-2)}
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:13px}
.bar-row .track{height:18px;border-radius:0 4px 4px 0;background:var(--line);position:relative;overflow:hidden}
.bar-row .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.bar-row .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.stack{display:flex;height:22px;gap:2px;border-radius:4px;overflow:hidden}
.stack i{display:block;height:100%}
.sparkwrap svg{width:100%;height:60px;display:block}
.note{font-size:12.5px;color:var(--ink-3)}
.menu-btn{display:none}
.rail-close{display:none;position:absolute;top:14px;right:12px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);place-items:center;color:var(--ink-2)}.rail-close svg{width:16px;height:16px}
.rail-scrim{display:none;position:fixed;inset:0;background:rgba(10,12,30,.35);z-index:45}.rail-scrim.open{display:block}
.badge-id{font-size:11px;color:var(--ink-3)}
.cover{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.cover i{width:9px;height:9px;border-radius:50%;display:inline-block}
.help{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.help svg{width:16px;height:16px;flex:0 0 auto;color:var(--navy);margin-top:1px}
@media (max-width:1100px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c5,.c7,.c8,.c6{grid-column:span 12}.c2{grid-column:span 4}}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 .rail{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s ease}
 .rail.open{transform:none}
 .menu-btn{display:inline-flex}.rail-close{display:grid}.rail .logo{max-width:150px;height:auto}
 .top{padding:10px 16px}.content{padding:14px 16px 32px}
 .form{grid-template-columns:1fr}
 .bar-row{grid-template-columns:110px 1fr 60px}
}
@media (max-width:560px){.c3,.c2{grid-column:span 12}.c3.half{grid-column:span 6}.c2{grid-column:span 6}.drawer{width:100%}.top h1{font-size:17px}}
</style>

</head>
<body>
<div class="shell">
 <aside class="rail" id="rail">
  <img class="logo" data-logo alt="Yinson GreenTech"><div class="brand">driv<b>EV</b><small>Fleet Command</small></div><button class="rail-close" id="railClose" aria-label="Close menu">ICON_X</button>
  <div class="sec">Monitor</div>
  <button class="nav" data-view="overview">ICON_HOME Overview</button>
  <button class="nav" data-view="alerts">ICON_BELL Alerts <span class="cnt" id="alertCnt">0</span></button>
  <button class="nav" data-view="map">ICON_MAP Live map</button>
  <button class="nav" data-view="vehicles">ICON_CAR Vehicles</button>
  <div class="sec">Charging</div>
  <button class="nav" data-view="sessions">ICON_BOLT Sessions</button>
  <button class="nav" data-view="costs">ICON_COINS Costs</button>
  <button class="nav" data-view="depots">ICON_DEPOT Depots &amp; chargers</button>
  <div class="sec">Setup</div>
  <button class="nav" data-view="policy">ICON_SLIDERS Fleet policy</button>
  <button class="nav" data-view="rules">ICON_LIST Alert rules</button>
  <div class="foot"><span style="display:block;margin-bottom:8px">Transforming fleets for a cleaner, smarter tomorrow.</span>Pos Malaysia · Klang Valley POC<br><a href="../driver/" id="driverLink">Open the driver app →</a></div>
 </aside>
 <div class="main">
  <header class="top">
   <button class="btn ghost sm menu-btn" id="menuBtn" aria-label="Open menu">ICON_MENU</button>
   <h1 id="title">Overview</h1>
   <div class="fleet"><span class="l">Fleet</span> Pos Malaysia · Klang Valley <span class="pill info" id="phasePill">POC · 50 vans</span></div>
   <div class="sp"></div>
   <span class="live"><i></i> Live · <span id="clock">09:41</span></span>
  </header>
  <div class="content" id="content"></div>
 </div>
</div>
<div class="rail-scrim" id="railScrim"></div>
<div id="layer"></div>

<script>

 <div class="f"><label for="retTime">Shift end</label><input type="time" id="retTime" value="${POLICY.retTime}"><div class="hint">Used for the return-to-depot projection.</div></div>
 <div class="f"><label>Route priority</label><div class="radio">${[['balanced','Balanced','Total stop time and cost weighted equally'],['time','Fastest stop','Shortest travel + wait + charge, cost second'],['cost','Cheapest','Lowest all-in cost, time second']].map(([k,l,h])=>`<label><input type="radio" name="prio" value="${k}" ${POLICY.priority===k?'checked':''}><span><b>${l}</b><br><span class="hint">${h}</span></span></label>`).join('')}</div></div>
 <div class="f"><label>Preferred networks, in order</label><div class="radio">${POLICY.nets.map((n,i)=>`<label style="cursor:default"><span class="pill info">${i+1}</span><span><b>${n}</b><br><span class="hint">${i===0?'Fixed Pos Malaysia rate RM 1.20/kWh':i===1?'Used when no chargEV bay within 5 km':'Only when nothing else is reachable'}</span></span></label>`).join('')}</div></div>
 <div class="f"><label>Alert channels</label><div class="radio">${[['portal','In portal'],['whatsapp','WhatsApp to duty manager'],['email','Email digest'],['sms','SMS']].map(([k,l])=>`<label class="sw" style="justify-content:space-between"><span>${l}</span><input type="checkbox" data-chan="${k}" ${POLICY.chan[k]?'checked':''}></label>`).join('')}</div></div>
 <div class="f"><label>Driver app</label><div class="radio"><label class="sw"><span><b>Start charging from the app</b><br><span class="hint">No RFID card or wallet for drivers</span></span><input type="checkbox" id="autoCharge" ${POLICY.autoCharge?'checked':''}></label><label class="sw"><span><b>Tag drivers to vans</b><br><span class="hint">Off in phase 1. Pos Malaysia already knows who drives which van.</span></span><input type="checkbox" id="tag" ${POLICY.tag?'checked':''}></label></div></div>
 </div></div>
 <div class="panel c4"><div class="ph"><div><h2>Effect of this policy right now</h2><p class="sub">Updates as you move the sliders.</p></div></div>
 <div class="kv" id="policyFx">${policyFx()}</div>
 <div class="help" style="margin-top:14px">${I.info}<div>Vehicle type BEV van, 60 kWh. Fixed rate agreed with chargEV: RM 1.20/kWh AC and DC, billed monthly to Pos Malaysia.</div></div></div></div>`},

rules(){return `<div class="grid"><div class="panel c8"><div class="ph"><div><h2>Alert rules</h2><p class="sub">Each rule fires once, to the channels in Fleet policy, and clears itself when the van is back within policy.</p></div></div><div class="rules">${rulesList(false)}</div></div>
 <div class="panel c4"><div class="ph"><div><h2>Principle</h2></div></div><p style="margin:0;font-size:14px;line-height:1.55">An operations manager should not watch 50 vans all day. The portal stays silent while vans are above the limit or already heading to a charger, and speaks only when a person has to act.</p></div></div>`}
};

function policyFx(){const low=V.filter(v=>v.soc<POLICY.th).length;const noact=V.filter(v=>v.soc<POLICY.th&&!v.routing&&v.st!=='charging'&&v.st!=='depot').length;const ret=V.filter(v=>projRet(v)<POLICY.ret&&v.st!=='depot').length;return `<div><div class="k">Vans under ${POLICY.th}% now</div><div class="v">${low}</div></div><div><div class="k">Would alert you</div><div class="v" style="color:${noact?'var(--bad)':'var(--green-2)'}">${noact}</div></div><div><div class="k">Return risk at ${POLICY.ret}%</div><div class="v" style="color:${ret?'var(--warn)':'var(--ink)'}">${ret}</div></div><div><div class="k">Stops added today</div><div class="v">${ret}</div></div>`}
function rulesList(short){const R=[['bad','Low battery, no action',`Battery under ${POLICY.th}% and no route to a charger started within ${POLICY.grace} min.`],['warn','Return-to-depot risk',`Projected battery at depot under ${POLICY.ret}% by ${POLICY.retTime}.`],['warn','Blocking a bay',`Van still at the charger ${POLICY.idle} min after charging finished.`],['warn','Vehicle offline','No position or battery update for 20 min during a shift.'],['info','Charger occupied on arrival','Driver reported a full charger. Logged for network planning; driver already re-routed.'],['info','Charging complete','Driver told to unplug. Shown here only for the session log.']];
 return R.map(([s,n,d])=>`<div class="rule"><span class="sev" style="background:var(--${s==='bad'?'bad':s==='warn'?'warn':'navy'})"></span><div><div class="n">${n}</div><div class="d">${d}</div></div>${short?'':'<span class="pill good">On</span>'}</div>`).join('')}
function evRow(a){const ack=S.acked.has(a.id);const ins=S.instructed.has(a.v.id);return `<div class="ev ${a.sev}"><span class="bar"></span><div><div class="t">${a.t}</div><div class="s">${a.s}</div><div class="acts">
 <button class="btn ghost sm" data-sel="${a.v.id}">${I.car} Open van</button>
 ${a.sev!=='info'?`<button class="btn ghost sm" data-call="${a.v.id}">${I.phone} Call ${POLICY.tag?a.v.driver:'driver'}</button>`:''}
 ${a.id.startsWith('low')?`<button class="btn navy sm" data-instruct="${a.v.id}" ${ins?'disabled':''}>${I.send} ${ins?'Instruction sent':'Send "Charge now"'}</button>`:''}
 ${ack?`<button class="btn primary sm" data-resolve="${a.id}">${I.check} Resolve</button>`:`<button class="btn ghost sm" data-ack="${a.id}">Acknowledge</button>`}
 </div></div><div class="when">${a.when}<br><span class="pill ${a.sev==='bad'?'bad':a.sev==='warn'?'warn':'info'}" style="margin-top:4px">${a.rule}</span></div></div>`}
function stripColor(k){return {route:'var(--good)',charging:'var(--s1)',low:'var(--bad)',depot:'var(--line-2)',idle:'var(--warn)'}[k]}
function strip(c){return `<div class="strip">${Object.keys(STL).map(k=>c[k]?`<i style="flex:${c[k]};background:${stripColor(k)}"></i>`:'').join('')}</div>`}
function netBars(){const by={};SESSIONS.forEach(r=>{by[r[2]]=(by[r[2]]||0)+r[6]});const max=Math.max(...Object.values(by));return `<div class="bar-chart">${Object.entries(by).map(([k,v])=>`<div class="bar-row"><div style="font-weight:600">${k}</div><div class="track"><i style="width:${v/max*100}%;background:var(--s1)"></i></div><div class="n">${v.toFixed(0)} kWh</div></div>`).join('')}</div>`}
function spark(d){const w=600,h=60,p=6;const max=Math.max(...d),min=0;const x=i=>p+i*(w-2*p)/(d.length-1),y=v=>h-p-(v-min)/(max-min)*(h-2*p);const pts=d.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Daily spend sparkline"><polygon points="${x(0)},${h-p} ${pts} ${x(d.length-1)},${h-p}" fill="var(--s1)" opacity=".1"/><polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(d.length-1)}" cy="${y(d[d.length-1])}" r="4" fill="var(--s1)" stroke="var(--panel)" stroke-width="2"/></svg><div class="row" style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px"><span>14 days ago</span><span>Today <b style="color:var(--ink)">RM ${d[d.length-1].toLocaleString()}</b></span></div>`}
function mapSvg(full){const vs=V.filter(v=>full?(S.filter==='all'||v.st===S.filter):true);
 const col=v=>v.offline?'var(--ink-3)':{route:'var(--good)',charging:'var(--s1)',low:'var(--bad)',depot:'var(--line-2)',idle:'var(--warn)'}[v.st];
 return `<div class="map"><svg viewBox="0 130 900 430" aria-label="Fleet map">
 <defs><pattern id="gg" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0v30" fill="none" stroke="var(--line)" stroke-width="1"/></pattern></defs>
 <rect width="900" height="560" fill="url(#gg)" opacity=".6"/>
 <g fill="none" stroke="var(--line-2)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M60 390 C 200 380, 320 340, 480 340 S 640 300, 760 280" stroke-width="12"/>
  <path d="M250 140 C 300 260, 380 300, 470 470" stroke-width="7"/>
  <path d="M120 470 C 300 440, 480 420, 700 530" stroke-width="7"/>
  <path d="M560 120 C 600 260, 620 380, 690 540" stroke-width="7"/>
  <path d="M700 180 C 760 300, 780 420, 720 540" stroke-width="6"/>
  <path d="M420 540 C 420 450, 500 380, 600 300 S 720 220, 800 170" stroke-width="6"/>
 </g>
 <text x="300" y="398" font-size="12" fill="var(--ink-3)" font-family="IBM Plex Sans,sans-serif">Federal Highway</text>
 <text x="585" y="470" font-size="12" fill="var(--ink-3)" font-family="IBM Plex Sans,sans-serif" transform="rotate(50 585 470)">MRR2</text>
 <text x="300" y="250" font-size="12" fill="var(--ink-3)" font-family="IBM Plex Sans,sans-serif" transform="rotate(62 300 250)">NKVE</text>
 ${DEPOTS.map(d=>`<rect x="${d.x-9}" y="${d.y-9}" width="18" height="18" rx="4" fill="var(--navy)"/>`).join('')}
 ${CHARGERS.map(c=>`<g><circle cx="${c.x}" cy="${c.y}" r="11" fill="var(--panel)" stroke="var(--green-2)" stroke-width="2.5"/><path transform="translate(${c.x-6} ${c.y-6}) scale(.5)" d="M13 2 4 14h7l-1 8 9-12h-7z" fill="var(--green-2)"/><text x="${c.x+14}" y="${c.y+4}" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Sans,sans-serif">${c.free}/${c.bays}</text></g>`).join('')}
 ${vs.map(v=>`<g class="veh" data-sel="${v.id}" tabindex="0" role="button" aria-label="${v.plate} ${v.soc}%"><circle cx="${v.x}" cy="${v.y}" r="${v.st==='low'?9:7}" fill="${col(v)}" stroke="var(--panel)" stroke-width="2"/>${v.st==='low'&&!v.routing?`<circle cx="${v.x}" cy="${v.y}" r="15" fill="none" stroke="var(--bad)" stroke-width="1.5" opacity=".6"/>`:''}${full&&S.filter!=='all'?`<text x="${v.x}" y="${v.y-12}" font-size="10" text-anchor="middle" fill="var(--ink-2)" font-family="ui-monospace,monospace">${v.plate.slice(4)}</text>`:''}</g>`).join('')}
 ${DEPOTS.map(d=>`<text x="${d.x}" y="${d.y-16}" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--navy)" font-family="Plus Jakarta Sans,sans-serif" pointer-events="none">${d.short}</text>`).join('')}
 </svg></div>`}

/* ---------- drawer ---------- */
function drawer(){const v=V.find(x=>x.id===S.sel);if(!v)return '';const d=depot(v.depot);const pr=projRet(v);const a=alerts().filter(x=>x.v.id===v.id);
 return `<div class="scrim" data-close="1"></div><aside class="drawer" aria-label="Vehicle detail"><div class="dh"><div><div class="eyebrow">${d.name}</div><h2 style="font-size:22px" class="plate">${v.plate}</h2></div><button class="btn ghost sm" data-close="1" aria-label="Close">${I.x}</button></div>
 <div class="db">
 <div style="display:flex;gap:8px;flex-wrap:wrap">${stPill(v)}${v.routing&&v.st!=='charging'?'<span class="pill good">Routing to charger</span>':''}${a.map(x=>`<span class="pill ${x.sev==='bad'?'bad':x.sev==='warn'?'warn':'info'}">${x.rule}</span>`).join('')}</div>
 <div class="kv"><div><div class="k">Battery</div><div class="v" style="color:${v.soc<POLICY.th?'var(--bad)':'inherit'}">${v.soc}%</div></div><div><div class="k">Range</div><div class="v">${range(v.soc)} km</div></div><div><div class="k">Projected at depot</div><div class="v" style="color:${pr<POLICY.ret?'var(--warn)':'var(--green-2)'}">${pr}%</div></div><div><div class="k">Runs left today</div><div class="v">${6-v.runs-2}</div></div></div>
 ${socCell(v)}
 <div><div class="eyebrow" style="margin-bottom:6px">Location</div><div style="font-weight:600">${v.st==='depot'?d.name:v.st==='charging'||v.st==='idle'?v.charger:'Near '+v.run}</div><div class="note">Updated 20 s ago · ${v.km} km today</div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn navy" data-instruct="${v.id}" ${S.instructed.has(v.id)?'disabled':''}>${I.send} ${S.instructed.has(v.id)?'Instruction sent':'Send "Charge now"'}</button><button class="btn ghost" data-call="${v.id}">${I.phone} Call ${POLICY.tag?v.driver:'van phone'}</button></div>
 <div class="note">Van phone ${v.phone.replace(/(\d{3})(\d{3})(\d+)/,'$1-$2 $3')} · ${POLICY.tag?'Driver '+v.driver:'Driver not tagged (phase 1)'}</div>
 <div><div class="eyebrow" style="margin-bottom:4px">Nearest chargers from here</div>${[CHARGERS.find(c=>c.name===d.primary)||CHARGERS[0],CHARGERS.find(c=>c.name===d.backup)||CHARGERS[1]].map((c,i)=>`<div class="tl"><span class="dot ${i?'':'g'}"></span><div><div style="font-weight:600">${c.name}</div><div class="note">${c.type} · ${i?d.bkm||3.4:d.pkm} km</div></div><span class="pill ${c.free?'good':'bad'}">${c.free}/${c.bays} free</span></div>`).join('')}</div>
 <div><div class="eyebrow" style="margin-bottom:4px">Today</div>
 <div class="tl"><span class="dot n"></span><div>Shift started at ${d.short}</div><span class="when">08:0${v.id.length}</span></div>
 ${v.lastCharge?`<div class="tl"><span class="dot g"></span><div>Charged at ${v.charger}<div class="note">28.3 kWh · RM 33.96 · 31 min stop</div></div><span class="when">${v.lastCharge}</span></div>`:''}
 ${v.soc<POLICY.th?`<div class="tl"><span class="dot b"></span><div>Dropped under ${POLICY.th}% near ${v.run}<div class="note">${v.routing?'Driver opened charging options and started a route':'Alert sent to driver. No route started yet.'}</div></div><span class="when">${v.since} min ago</span></div>`:''}
 ${S.instructed.has(v.id)?`<div class="tl"><span class="dot n"></span><div>"Charge now" pushed to the driver app</div><span class="when">just now</span></div>`:''}
 </div></div></aside>`}

/* ---------- render ---------- */
const TITLES={overview:'Overview',alerts:'Alerts',map:'Live map',vehicles:'Vehicles',sessions:'Charging sessions',costs:'Costs',depots:'Depots & chargers',policy:'Fleet policy',rules:'Alert rules'};
function render(){$('#content').innerHTML=VIEWS[S.view]();$('#title').textContent=TITLES[S.view];document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));$('#alertCnt').textContent=alerts().filter(a=>!S.acked.has(a.id)&&a.sev!=='info').length;$('#rail').classList.remove('open');$('#railScrim').classList.remove('open');renderLayer()}
function renderLayer(){$('#layer').innerHTML=(S.sel?drawer():'')+(S.toast?`<div class="toast">${I.check}${S.toast}</div>`:'')}

document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-filter],[data-sel],[data-close],[data-ack],[data-resolve],[data-instruct],[data-call],[data-toast]');if(!b)return;const d=b.dataset;
 if(d.view){S.view=d.view;S.filter='all';S.q='';render();window.scrollTo(0,0);return}
 if(d.filter){S.filter=d.filter;render();return}
 if(d.sel){S.sel=d.sel;renderLayer();return}
 if(d.close!==undefined){S.sel=null;renderLayer();return}
 if(d.ack){S.acked.add(d.ack);render();toast('Acknowledged. You own this one now.');return}
 if(d.resolve){S.resolved.add(d.resolve);render();toast('Resolved');return}
 if(d.instruct){S.instructed.add(d.instruct);const v=V.find(x=>x.id===d.instruct);v.routing=true;render();toast(`"Charge now" sent to ${v.plate}. Driver app opened charging options.`);return}
 if(d.call){const v=V.find(x=>x.id===d.call);toast(`Calling van phone ${v.phone}`);return}
 if(d.toast){toast(d.toast);return}
});
document.addEventListener('input',e=>{const id=e.target.id;
 if(id==='q'){S.q=e.target.value.toLowerCase();const tb=$('tbody');if(tb){const tmp=document.createElement('div');tmp.innerHTML=VIEWS.vehicles();$('#content tbody').innerHTML=tmp.querySelector('tbody').innerHTML}return}
 if(id==='th'){POLICY.th=+e.target.value;$('#thVal').textContent=POLICY.th+'%';$('#policyFx').innerHTML=policyFx();$('#alertCnt').textContent=alerts().filter(a=>a.sev!=='info').length}
 if(id==='ret'){POLICY.ret=+e.target.value;$('#retVal').textContent=POLICY.ret+'%';$('#policyFx').innerHTML=policyFx()}
 if(id==='grace'){POLICY.grace=parseInt(e.target.value)}
 if(id==='retTime'){POLICY.retTime=e.target.value}
 if(id==='autoCharge'){POLICY.autoCharge=e.target.checked}
 if(id==='tag'){POLICY.tag=e.target.checked}
 if(e.target.name==='prio'){POLICY.priority=e.target.value}
 if(e.target.dataset.chan){POLICY.chan[e.target.dataset.chan]=e.target.checked}
 if(id==='savePolicy'){}
});
document.addEventListener('click',e=>{if(e.target.closest('#savePolicy')){toast(`Policy saved. ${V.length} vans updated; driver apps refresh on next open.`)}});
const railOpen=o=>{$('#rail').classList.toggle('open',o);$('#railScrim').classList.toggle('open',o)};
$('#menuBtn').addEventListener('click',()=>railOpen(true));$('#railClose').addEventListener('click',()=>railOpen(false));$('#railScrim').addEventListener('click',()=>railOpen(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel){S.sel=null;renderLayer()}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.sel){S.sel=e.target.dataset.sel;renderLayer()}});
function tick(){$('#clock').textContent=new Date().toTimeString().slice(0,5);S.tick++;
 V.forEach(v=>{if(v.st==='charging'){v.soc=Math.min(80,v.soc+1);if(v.soc>=80){v.st='idle';v.since=0}}
  else if(v.st==='idle'){v.since++;if(v.since>POLICY.idle+12){v.st='route';v.since=0}}
  else if(v.st==='low'){v.since++;if(v.routing&&v.since>6){v.st='charging';v.since=0}}
  else if(v.st==='route'&&S.tick%3===0){v.soc=Math.max(5,v.soc-1);if(v.soc<POLICY.th){v.st='low';v.since=0;v.routing=rnd()<0.6}}});
 const typing=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
 if(!S.sel&&!typing&&(S.view==='overview'||S.view==='map'||S.view==='vehicles'))render();else $('#alertCnt').textContent=alerts().filter(a=>!S.acked.has(a.id)&&a.sev!=='info').length}
setInterval(tick,8000);$('#clock').textContent=new Date().toTimeString().slice(0,5);
render();
})();
</script>
</body>
</html>
