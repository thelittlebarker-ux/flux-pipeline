<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>drivEV Driver</title>
<meta name="description" content="drivEV driver app prototype for Pos Malaysia EV vans: low-battery alert, ranked charging stops, navigation, charging and a pictorial guide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single phone column (390px) centred in a bezel on desktop with a demo panel beside it; full-bleed on phones. */
:root{
  --navy:#17145a; --navy-2:#2a2680; --green:#17a874; --green-2:#0e8c5f; --mint:#dff5ec; --mint-2:#b9ead6;
  --bg:#ffffff; --screen:#f5f7fb; --card:#ffffff; --ink:#15173a; --ink-2:#4f5478; --ink-3:#8a8fae; --line:#e0e4ee; --line-2:#cfd4e2;
  --good:#17a874; --warn:#e08a00; --bad:#d93d3d; --warn-bg:#fff4e0; --bad-bg:#fdeaea; --good-bg:#e4f7ef; --info-bg:#e8edff;
  --bezel:#1b1d2b; --shadow:0 18px 50px rgba(23,20,90,.18);
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:var(--display);letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:32px;padding:24px 16px;flex-wrap:wrap}
.bezel{width:390px;max-width:100%;height:820px;max-height:calc(100vh - 48px);background:var(--bezel);border-radius:46px;padding:12px;box-shadow:var(--shadow);position:relative;flex:0 0 auto}
.phone{position:relative;width:100%;height:100%;background:var(--screen);border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:var(--bezel);border-radius:20px;z-index:5}
.statusbar{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-family:var(--display);font-weight:700;font-size:14px;color:#fff;background:var(--navy)}
.statusbar .right{display:flex;gap:5px;align-items:center}
.app{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 14px;gap:8px;background:var(--navy);color:#fff;margin-bottom:12px;border-radius:0 0 22px 22px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;letter-spacing:-.02em}
.brand b{color:var(--green)}
.plate{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;font-size:12px;padding:5px 9px;border:1.5px solid rgba(255,255,255,.45);border-radius:8px;letter-spacing:.06em;color:#fff}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden;font-size:12px;font-weight:600}
.lang button{padding:5px 9px;color:rgba(255,255,255,.75)}
.lang button.on{background:#fff;color:var(--navy)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.tight{padding:12px 14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
.h.big{font-size:28px}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;font-family:var(--display);font-weight:700;font-size:17px;padding:0 18px;transition:transform .08s ease}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--green);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--line-2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-2,var(--good))}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--navy)}
.pill.mint{background:var(--mint);color:var(--green-2)}
.ic{width:20px;height:20px;flex:0 0 auto}
.ic.lg{width:28px;height:28px}
.icw{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.icw.mint{background:var(--mint);color:var(--green-2)}
.icw.info{background:var(--info-bg);color:var(--navy)}
.icw.warn{background:var(--warn-bg);color:var(--warn)}
.icw.bad{background:var(--bad-bg);color:var(--bad)}
.ring{position:relative;width:188px;height:188px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.03em}
.ring .km{color:var(--ink-2);font-size:14px;margin-top:4px}
.opt{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:left;width:100%}
.opt.rec{border-color:var(--green);box-shadow:0 0 0 3px var(--mint)}
.opt .name{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink)}
.opt .addr{font-size:13px;color:var(--ink-2)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meta div{background:var(--screen);border-radius:10px;padding:8px 8px}
.meta .v{font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink);line-height:1.1}
.meta .l{font-size:11px;color:var(--ink-3)}
.rank{width:30px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;background:var(--navy);color:#fff}
.rank.one{background:var(--green);color:#fff}
.stats6{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.s6{display:flex;gap:8px;align-items:center;min-width:0}.s6i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:var(--screen)}.s6i.navy{color:var(--navy)}.s6i.green{color:var(--green-2)}.s6i.bad{color:var(--bad)}.s6i.warn{color:var(--warn)}.s6i svg{width:16px;height:16px}.s6 .v{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.15;color:var(--ink)}.s6 .l{font-size:11px;color:var(--ink-3)}
.trip{display:grid;grid-template-columns:repeat(3,1fr);margin:10px 0 6px}.trip>div{text-align:center;padding:6px 4px;border-left:1px solid var(--line)}.trip>div:first-child{border-left:0}.ti{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--navy)}.ti.green{color:var(--green-2)}.ti svg{width:20px;height:20px}.trip .v{font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink)}.trip .l{font-size:11px;color:var(--ink-3)}
.logo{height:34px;width:auto;display:block;align-self:flex-start;object-fit:contain}
.map{position:relative;background:linear-gradient(180deg,var(--mint) 0%,var(--screen) 100%);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:200px}
.map svg{width:100%;height:100%;display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:14px 18px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.25);z-index:20;display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
.scrim{position:absolute;inset:0;background:rgba(10,12,30,.45);z-index:15;animation:fade .2s ease}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 4px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){ .sheet,.scrim{animation:none} }
.toast{position:absolute;bottom:96px;left:16px;right:16px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;z-index:30;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.notif{background:var(--card);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);text-align:left;width:100%}
.notif .app-ic{width:40px;height:40px;border-radius:10px;background:var(--navy);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:11px;flex:0 0 auto}
.lock{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:28px;padding:38px 18px 18px;background:radial-gradient(120% 70% at 50% 0%,var(--navy-2) 0%,var(--navy) 55%,#0b0a2e 100%);color:#fff}
.lock .time{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;text-align:center;letter-spacing:-.04em}
.lock .date{text-align:center;opacity:.85;font-size:16px;margin-top:6px}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:block}
.steps i.on{background:var(--green);width:22px;border-radius:4px}
.guide-ic{width:150px;height:150px;border-radius:40px;background:var(--mint);display:grid;place-items:center;margin:0 auto;color:var(--green-2)}
.guide-ic svg{width:84px;height:84px}
.num{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:0}
.list .li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.list .li .t{font-weight:600;color:var(--ink)}
.list .li .s{font-size:12.5px;color:var(--ink-2)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--good)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 0;border-radius:10px}
.tabbar button.on{color:var(--green-2)}
.tabbar button svg{width:22px;height:22px}
.input{width:100%;border:1.5px solid var(--line-2);border-radius:14px;padding:14px 16px;font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;letter-spacing:.12em;text-transform:uppercase;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.06em;color:var(--ink)}
.chip.on{border-color:var(--green);background:var(--mint);color:var(--green-2)}
.timeline{display:flex;flex-direction:column}
.timeline .tl{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.timeline .tl:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--green);margin-top:5px;margin-left:5px;box-shadow:0 0 0 3px var(--mint)}
.dot.nav{background:var(--navy);box-shadow:0 0 0 3px var(--info-bg)}
.dot.muted{background:var(--line-2);box-shadow:none}
/* demo panel */
.demo{width:300px;max-width:100%;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 24px rgba(23,20,90,.08);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.demo h3{margin:0;font-size:15px}
.demo p{margin:0;font-size:13px;color:var(--ink-2)}
.demo .btn{min-height:42px;font-size:14px;border-radius:12px}
.demo label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between}
.demo input[type=range]{width:100%;accent-color:var(--green)}
.demo .a{color:var(--green-2);font-weight:600;text-decoration:none;font-size:13px}
.demo-fab{display:none}
@media (max-width:640px){
  .stage{padding:0;gap:0;align-items:stretch}
  .bezel{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none}
  .phone{border-radius:0}
  .notch{display:none}
  .statusbar{height:calc(10px + env(safe-area-inset-top,0px));padding:0}
  .statusbar span{display:none}
  .demo{display:none}
  .demo.open{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:50;box-shadow:var(--shadow)}
  .demo-fab{display:flex;position:fixed;right:14px;bottom:88px;z-index:51;background:var(--navy);color:#fff;border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:12.5px;color:var(--ink-3)}
.hl{color:var(--green-2);font-weight:700}
</style>

</head>
<body>
<div class="stage">
  <div class="bezel">
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="statusbar"><span id="clock">09:41</span><span class="right">●●●● ▲ ▮</span></div>
      <div class="app" id="app"></div>
    </div>
  </div>
  <aside class="demo" id="demo" aria-label="Demo controls">
    <img class="logo" data-logo alt="Yinson GreenTech"><h3>Demo controls</h3>
    <p>Drive the prototype through the Pos Malaysia POC scenario without waiting for a real battery to drop.</p>
    <label>Battery <span id="socLbl">62%</span></label>
    <input type="range" id="socRange" min="5" max="100" value="62" aria-label="Simulate battery level">
    <button class="btn navy" id="dAlert">1 · Drop battery to 28% and send alert</button>
    <button class="btn ghost" id="dOcc">2 · Charger occupied on arrival</button>
    <button class="btn ghost" id="dDone">3 · Jump to charging complete</button>
    <button class="btn ghost" id="dReset">Reset to start of shift</button>
    <a class="a" href="../portal/" id="portalLink">Open the fleet manager portal →</a>
  </aside>
  <button class="demo-fab" id="demoFab">Demo</button>
</div>

 <div class="grid2"><div class="stat"><div class="v">${S.km} ${t('km')}</div><div class="l">${t('kmToday',{km:''}).trim()}</div></div><div class="stat"><div class="v">${S.runsDone}/6</div><div class="l">${t('todayRuns')}</div></div><div class="stat"><div class="v">${S.stops.length}</div><div class="l">${t('stops')}</div></div><div class="stat"><div class="v">RM ${spent.toFixed(0)}</div><div class="l">${t('spent')}</div></div></div>
 <div class="card tight row"><span class="icw mint">${I.clock}</span><div><div style="font-weight:700;font-family:var(--display)">${saved} ${t('min')}</div><div class="note">${t('saved')}</div></div></div>
 <div class="card tight"><div class="eyebrow" style="margin-bottom:4px">${t('hist')}</div><div class="timeline">${S.stops.length?S.stops.map(s=>`<div class="tl"><span class="dot"></span><div><div style="font-weight:600">${s.name}</div><div class="note">${s.kwh.toFixed(1)} kWh · ${s.mins} ${t('min')}</div></div><div style="font-weight:700">RM ${s.cost.toFixed(0)}</div></div>`).join(''):`<div class="tl"><span class="dot muted"></span><div class="note">—</div><div></div></div>`}</div></div>
 <div style="margin-top:auto"></div>
 <button class="btn ghost sm" data-reset="1">${I.flag}${t('endShift')}</button>
 </div>${tabbar('shift')}`}
};
function sheetOcc(){const backup=CH[1];return `<div class="scrim" data-close="1"></div><div class="sheet"><div class="grab"></div><div class="row"><span class="icw bad">${I.warn}</span><div><h2 class="h" style="font-size:20px">${t('occTitle')}</h2><p class="sub">${t('occSub')}</p></div></div>
<button class="opt rec" data-backup="${backup.id}"><div class="row between"><div class="row"><span class="rank one">02</span><span class="pill good">${t('recommended')}</span></div><span class="note">${backup.km} ${t('km')}</span></div><div><div class="name">${brandName(backup.name)}</div><div class="addr">${backup.type} · ${backup.bays} ${t('bays').toLowerCase()}</div></div></button>
<button class="btn primary" data-backup="${backup.id}">${I.nav}${t('goBackup',{name:backup.name.split(' ').slice(0,2).join(' ')})}</button>
<button class="btn ghost sm" data-close="1">${t('stayWait',{min:15})}</button></div>`}
function render(){const app=$('#app');app.innerHTML=(V[S.screen]||V.home)()+(S.sheet==='occ'?sheetOcc():'')+(S.toast?`<div class="toast">${I.check}${S.toast}</div>`:'');
 $('#socLbl').textContent=S.soc+'%';$('#socRange').value=S.soc;$('#demo').classList.toggle('open',S.demoOpen);}
function startCharge(){const ch=CH.find(c=>c.id===S.sel);S.charging={from:S.soc,leaveBy:addMin(ch.charge+10),start:Date.now()};go('charging');clearInterval(timers.charge);timers.charge=setInterval(()=>{if(S.screen!=='charging')return;S.soc=Math.min(80,S.soc+1);if(S.soc>=80)finishCharge();else render();},700)}
function finishCharge(){clearInterval(timers.charge);const ch=CH.find(c=>c.id===S.sel);const kwh=kwhNeeded(S.charging.from,80);S.soc=80;S.stops.push({name:ch.name,kwh,cost:kwh*ch.rate,mins:total(ch)});S.charging=null;S.hold=null;S.runsDone=Math.min(6,S.runsDone+1);go('done')}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go],[data-lang],[data-plate],[data-start],[data-sel],[data-hold],[data-occ],[data-close],[data-backup],[data-startcharge],[data-stopcharge],[data-gstep],[data-reset],[data-dismiss-msg],[data-alert]');if(!b)return;const d=b.dataset;
 if(d.lang){S.lang=d.lang;render();return}
 if(d.plate){S.plate=d.plate;render();return}
 if(d.start!==undefined){S.plate=($('#plateIn').value||S.plate).toUpperCase();if(!S.plate)return;go('home');toast(t('toastShift'));return}
 if(d.sel){S.sel=d.sel;go('detail');return}
 if(d.hold!==undefined){S.hold=addMin(15);render();toast(t('toastHold'));return}
 if(d.occ!==undefined){S.sheet='occ';render();setTimeout(()=>toast(t('toastFleet')),300);return}
 if(d.close!==undefined){S.sheet=null;render();return}
 if(d.backup){S.sel=d.backup;S.hold=addMin(15);S.navProg=0.1;go('navigate');toast(t('toastRoute'));return}
 if(d.startcharge!==undefined){startCharge();return}
 if(d.stopcharge!==undefined){finishCharge();return}
 if(d.gstep){S.guideStep=Math.max(0,Math.min(6,S.guideStep+ +d.gstep));render();return}
 if(d.reset!==undefined){const lang=S.lang;S=S0();S.lang=lang;render();return}
 if(d.dismissMsg!==undefined){S.fleetMsg=false;render();return}
 if(d.go){if(d.go==='navigate')S.navProg=0.35;go(d.go);return}
});
document.addEventListener('input',e=>{if(e.target.id==='plateIn'){S.plate=e.target.value.toUpperCase();const btn=document.querySelector('[data-start]');if(btn){btn.disabled=!S.plate;btn.style.opacity=S.plate?'1':'.5'}}
 if(e.target.id==='socRange'){S.soc=+e.target.value;render()}});
$('#dAlert').addEventListener('click',()=>{S.soc=28;S.hold=null;S.sel=null;S.sheet=null;if(!S.plate)S.plate='WVL 2301';go('lock')});
$('#dOcc').addEventListener('click',()=>{if(!S.sel)S.sel='c1';if(!S.plate)S.plate='WVL 2301';if(S.soc>TH)S.soc=28;S.navProg=0.9;go('navigate');S.sheet='occ';render();setTimeout(()=>toast(t('toastFleet')),300)});
$('#dDone').addEventListener('click',()=>{if(!S.sel)S.sel='c1';if(!S.plate)S.plate='WVL 2301';if(!S.charging)S.charging={from:S.soc<80?S.soc:28,leaveBy:addMin(0)};finishCharge()});
$('#dReset').addEventListener('click',()=>{const lang=S.lang;S=S0();S.lang=lang;render()});
$('#demoFab').addEventListener('click',()=>{S.demoOpen=!S.demoOpen;render()});
function tick(){const d=new Date();$('#clock').textContent=d.toTimeString().slice(0,5);if(S.screen==='navigate'&&S.navProg<0.92){S.navProg=Math.min(0.92,(S.navProg||0.35)+0.03);render()}}
setInterval(tick,2000);tick();
setTimeout(()=>{if(S.screen==='home'&&S.soc>TH){S.fleetMsg=true;render()}},9000);
render();
})();
</script>
</body>
</html>
